<!DOCTYPE html>
<html>
<head>
<title>Ayaka Motion - Maintenance</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:black;color:white;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;flex-direction:column;text-align:center}
h1{font-size:40px}
p{color:#aaa}
.loader{margin-top:20px;width:50px;height:50px;border:5px solid #333;border-top:5px solid white;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>
<h1>🛠️ AYAKA MOTION</h1>
<h2>Lagi Maintenance!</h2>
<p>Kita lagi upgrade biar makin keren & kenceng.</p>
<p>Balik lagi nanti ya!</p>
<div class="loader"></div>
</body>
</html>
